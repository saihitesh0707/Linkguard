<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkGuard Warning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1a1a2e;
      border: 2px solid #e74c3c;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 0 40px rgba(231, 76, 60, 0.3);
    }
    .shield { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #e74c3c; font-size: 28px; margin-bottom: 12px; }
    .url-box {
      background: #0f0f1a;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      padding: 12px;
      margin: 20px 0;
      font-size: 13px;
      color: #aaa;
      word-break: break-all;
    }
    .reason {
      background: #2a1a1a;
      border-left: 4px solid #e74c3c;
      border-radius: 4px;
      padding: 12px 16px;
      margin: 16px 0;
      font-size: 14px;
      color: #ffaaaa;
      text-align: left;
    }
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }
    .btn-safe {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-proceed {
      background: transparent;
      color: #888;
      border: 1px solid #444;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-safe:hover { background: #1d4ed8; }
    .btn-proceed:hover { color: #ccc; border-color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>⚠️ Danger Detected!</h1>
    <p style="color:#aaa; font-size:14px;">
      LinkGuard blocked this link before it could harm you
    </p>
    <div class="url-box" id="dangerous-url">Loading...</div>
   <div class="reason">
  ⚠️ <strong>AI Analysis:</strong>
  <p id="ai-reason">Analyzing threat...</p>
</div>
    <div class="buttons">
      <button class="btn-safe" id="btn-back">
        ✅ Go Back — Stay Safe
      </button>
      <button class="btn-proceed" id="btn-proceed">
        I understand, proceed
      </button>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
